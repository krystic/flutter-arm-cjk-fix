name: Shell Quality

on:
  push:
    paths:
      - 'flutter-font-fix'
      - 'src/**'
      - 'install.sh'
      - 'tests/**'
      - '.shellcheckrc'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'flutter-font-fix'
      - 'src/**'
      - 'install.sh'
      - 'tests/**'
      - '.shellcheckrc'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck 0.11.0
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "${archive}"
          sudo install -m 0755 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          shellcheck --version

      - name: Check shell syntax
        run: bash -n flutter-font-fix install.sh src/*.sh tests/run-tests.sh

      - name: Run ShellCheck
        run: shellcheck flutter-font-fix install.sh src/*.sh tests/run-tests.sh

      - name: Run simulated Bash tests
        run: bash tests/run-tests.sh
